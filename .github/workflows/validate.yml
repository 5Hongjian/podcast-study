name: Validate skill
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate public files and templates
        run: python3 scripts/validate.py
      - name: Test install and update preservation
        run: python3 -m unittest discover -s tests -v
